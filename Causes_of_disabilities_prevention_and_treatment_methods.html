<style>
/* ==========================================================================
   CSS System & Variables - "Emerald Luxury" Theme
   ========================================================================== */
:root {
  --c-primary: #059669; 
  --c-primary-light: #d1fae5; 
  --c-primary-dark: #047857; 
  --c-accent: #f59e0b; 
  --c-accent-light: #fef3c7; 
  --c-bg: #f8fafc; 
  --c-surface: #ffffff;
  --c-text-main: #1e293b; 
  --c-text-muted: #64748b; 
  --c-danger: #ef4444;
  --c-danger-light: #fee2e2;
  --c-success: #10b981;
  --c-border: #e2e8f0;
  --font-main: 'Cairo', sans-serif;
  --font-story: 'Tajawal', sans-serif;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-glow: 0 0 15px rgba(5, 150, 105, 0.3);
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --r-full: 9999px;
  --t-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background-color: var(--c-bg);
  color: var(--c-text-main);
  line-height: 1.8;
  overflow-x: hidden;
  background-image: radial-gradient(var(--c-primary-light) 1px, transparent 1px);
  background-size: 30px 30px;
}

/* Typography */
h2 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; color: var(--c-primary); margin-bottom: 15px; }
p { font-size: clamp(1rem, 2.5vw, 1.15rem); color: var(--c-text-main); margin-bottom: 15px; }
strong { color: var(--c-primary-dark); font-weight: 800; }

/* Layout */
#progress-container { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--c-border); z-index: 1001; }
#progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--c-accent), var(--c-primary)); transition: width var(--t-base); box-shadow: var(--shadow-glow); }

header {
  position: fixed; top: 6px; left: 0; right: 0; height: 65px;
  background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(10px, 3vw, 30px); border-bottom: 1px solid var(--c-border); z-index: 1000;
  box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--c-primary-dark); }
.stats { display: flex; align-items: center; gap: 10px; }
.badge { background: var(--c-bg); border: 1px solid var(--c-border); padding: 5px 12px; border-radius: var(--r-full); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }

main { padding: 90px 15px 120px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.slide { display: none; width: 100%; max-width: 900px; animation: fadeUp var(--t-base) forwards; }
.slide.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

footer {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 15px clamp(10px, 3vw, 30px);
  background: rgba(255, 255, 255, 0.98); border-top: 1px solid var(--c-border);
  display: flex; justify-content: space-between; align-items: center; z-index: 1000;
}

/* UI Components */
.card { background: var(--c-surface); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 35px); box-shadow: var(--shadow-md); border: 1px solid rgba(5, 150, 105, 0.1); margin-bottom: 25px; }
.tag { display: inline-block; padding: 5px 15px; background: var(--c-primary-light); color: var(--c-primary-dark); border-radius: var(--r-full); font-size: 0.8rem; font-weight: 800; margin-bottom: 15px; }
.story-box { background: linear-gradient(to left, var(--c-bg), var(--c-surface)); border-right: 4px solid var(--c-accent); padding: 20px; border-radius: var(--r-md); margin-bottom: 20px; display: flex; gap: 15px; }
.story-box i { font-size: 2rem; color: var(--c-accent); }
.story-box p { font-family: var(--font-story); font-size: 1.1rem; color: var(--c-text-main); margin: 0; font-style: italic; }
.visual-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: var(--r-md); padding: 25px; margin: 20px 0; text-align: center; }
.v-icon { font-size: 4rem; color: var(--c-primary); margin-bottom: 10px; }

/* Activities */
.activity-box { background: linear-gradient(135deg, var(--c-surface), #fefce8); border: 1px solid var(--c-accent); border-radius: var(--r-lg); padding: 25px; }
.act-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #b45309; font-weight: 900; }
.act-options { display: grid; gap: 12px; margin-top: 15px; }
.act-btn { background: var(--c-surface); border: 2px solid var(--c-border); padding: 15px; border-radius: var(--r-md); cursor: pointer; font-family: var(--font-main); font-weight: 600; text-align: right; transition: all var(--t-base); display: flex; justify-content: space-between; }
.act-btn:hover:not(:disabled) { border-color: var(--c-primary); transform: translateX(-5px); background: var(--c-primary-light); }
.act-btn.correct { background: var(--c-success-light); border-color: var(--c-success); color: #065f46; }
.act-btn.wrong { background: var(--c-danger-light); border-color: var(--c-danger); color: #991b1b; }
.feedback-msg { margin-top: 15px; padding: 15px; border-radius: var(--r-sm); font-weight: 700; display: none; }

/* Buttons */
.btn { padding: 12px 30px; border-radius: var(--r-full); border: none; font-weight: 800; cursor: pointer; font-family: var(--font-main); transition: all var(--t-base); display: flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--c-primary); color: white; box-shadow: var(--shadow-md); }
.btn-outline { background: var(--c-surface); color: var(--c-text-muted); border: 1px solid var(--c-border); }
</style>
</head>

<main id="main-container"></main>

// --- Logic (Identical to test4.html system) ---
let currentSlide = 0;
let userScore = 0;
const totalSlides = SLIDE_DATA.length;
const mainContainer = document.getElementById('main-container');
const prevBtn = document.getElementById('btn-prev');
const nextBtn = document.getElementById('btn-next');
const scoreDisplay = document.getElementById('scoreDisplay');

function initApp() {
  SLIDE_DATA.forEach((slide, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide card' + (index === 0 ? ' active' : '');
    slideDiv.id = 'slide-' + index;

    let html = `<div class="tag">${slide.tag}</div><h2>${slide.title}</h2>`;
    if(slide.story) html += `<div class="story-box"><i class="fa-solid fa-quote-right"></i><p>${slide.story}</p></div>`;
    if(slide.content) html += `<p>${slide.content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>`;
    if(slide.visual) html += `<div class="visual-box">${slide.visual}</div>`;
    if(slide.quiz) {
      html += `
        <div class="activity-box" id="actBox-${index}" data-answered="false">
          <div class="act-header"><i class="fa-solid fa-bolt"></i> تحدي الاستيعاب:</div>
          <p style="font-weight:700;">${slide.quiz.q}</p>
          <div class="act-options">
            <button class="act-btn" onclick="handleAct(${index}, this, 0, ${slide.quiz.ans}, '${slide.quiz.fb}')"><span>${slide.quiz.opts[0]}</span></button>
            <button class="act-btn" onclick="handleAct(${index}, this, 1, ${slide.quiz.ans}, '${slide.quiz.fb}')"><span>${slide.quiz.opts[1]}</span></button>
          </div>
          <div class="feedback-msg" id="fb-${index}"></div>
        </div>`;
    }
    if(index === totalSlides - 1) html += `<center><button class="btn btn-primary" onclick="location.reload()">إعادة الدورة</button></center>`;
    slideDiv.innerHTML = html;
    mainContainer.appendChild(slideDiv);
  });
  updateUI();
}

function handleAct(slideIdx, btn, chosenIdx, correctIdx, fb) {
  const box = document.getElementById(`actBox-${slideIdx}`);
  if (box.getAttribute('data-answered') === "true") return;
  box.setAttribute('data-answered', "true");
  const buttons = box.querySelectorAll('.act-btn');
  const fbDiv = document.getElementById(`fb-${slideIdx}`);
  buttons.forEach(b => b.disabled = true);
  if (chosenIdx === correctIdx) {
    btn.classList.add('correct');
    fbDiv.innerHTML = "✅ " + fb; fbDiv.style.backgroundColor = "var(--c-success-light)";
    userScore += 50; scoreDisplay.innerText = userScore;
    confetti({ particleCount: 50, spread: 60 });
  } else {
    btn.classList.add('wrong');
    fbDiv.innerHTML = "❌ " + fb; fbDiv.style.backgroundColor = "var(--c-danger-light)";
    buttons[correctIdx].classList.add('correct');
  }
  fbDiv.style.display = "block";
}

function move(dir) {
  const slides = document.querySelectorAll('.slide');
  if (currentSlide + dir < 0 || currentSlide + dir >= totalSlides) return;
  slides[currentSlide].classList.remove('active');
  currentSlide += dir;
  slides[currentSlide].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateUI();
  if (currentSlide === totalSlides - 1) document.getElementById('finalScoreText').innerText = userScore;
}

function updateUI() {
  document.getElementById('counter').innerText = `${currentSlide + 1} / ${totalSlides}`;
  document.getElementById('progress-bar').style.width = (((currentSlide + 1) / totalSlides) * 100) + '%';
  prevBtn.disabled = currentSlide === 0;
  nextBtn.style.display = currentSlide === totalSlides - 1 ? "none" : "flex";
  const lv = userScore >= 300 ? "خبير وقائي" : (userScore >= 150 ? "متدرب" : "مبتدئ");
  document.getElementById('levelDisplay').innerText = lv;
}

window.onload = initApp;
</script>
