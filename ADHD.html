<style>
/* ==========================================================================
   CSS System - Emerald Neuro Theme
   ========================================================================== */
:root {
  --c-primary: #059669; 
  --c-primary-light: #d1fae5; 
  --c-primary-dark: #047857; 
  --c-accent: #f59e0b; 
  --c-bg: #0f172a; /* تم اختيار خلفية داكنة تناسب طابع الدماغ والأعصاب */
  --c-surface: #1e293b;
  --c-text-main: #f8fafc; 
  --c-text-muted: #94a3b8; 
  --c-danger: #ef4444;
  --c-success: #10b981;
  --c-border: rgba(255, 255, 255, 0.1);
  --font-main: 'Cairo', sans-serif;
  --font-story: 'Tajawal', sans-serif;
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
  --r-lg: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background-color: var(--c-bg);
  color: var(--c-text-main);
  line-height: 1.8;
  background-image: radial-gradient(rgba(5, 150, 105, 0.15) 1px, transparent 1px);
  background-size: 30px 30px;
}

#progress-container { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: rgba(255,255,255,0.1); z-index: 1001; }
#progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--c-accent), var(--c-primary)); transition: 0.3s; box-shadow: 0 0 10px var(--c-primary); }

header {
  position: fixed; top: 6px; left: 0; right: 0; height: 65px;
  background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--c-border); z-index: 1000;
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: #10b981; }
.stats { display: flex; align-items: center; gap: 10px; }
.badge { background: rgba(255,255,255,0.05); border: 1px solid var(--c-border); padding: 5px 12px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; color: white; }

main { padding: 90px 15px 120px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.slide { display: none; width: 100%; max-width: 900px; animation: fadeUp 0.5s forwards; }
.slide.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--c-surface); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 35px); box-shadow: var(--shadow-lg); border: 1px solid var(--c-border); margin-bottom: 25px; }
.tag { display: inline-block; padding: 5px 15px; background: rgba(16, 185, 129, 0.2); color: #34d399; border-radius: 50px; font-size: 0.8rem; font-weight: 800; margin-bottom: 15px; border: 1px solid rgba(16, 185, 129, 0.3); }

.story-box { background: rgba(255, 255, 255, 0.03); border-right: 4px solid var(--c-accent); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; }
.story-box i { font-size: 1.8rem; color: var(--c-accent); }
.story-box p { font-family: var(--font-story); font-style: italic; margin: 0; color: #e2e8f0; }

.visual-box { background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; margin: 20px 0; text-align: center; }
.v-icon { font-size: 3.5rem; color: #10b981; margin-bottom: 10px; text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

.activity-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: var(--r-lg); padding: 25px; }
.act-btn {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--c-border); padding: 15px;
  border-radius: 12px; cursor: pointer; font-family: var(--font-main); font-size: 1rem;
  font-weight: 600; text-align: right; margin-bottom: 10px; transition: all 0.2s; color: white;
  display: flex; justify-content: space-between; align-items: center;
}
.act-btn:hover:not(:disabled) { background: rgba(16, 185, 129, 0.1); border-color: var(--c-primary); transform: translateX(-5px); }
.act-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--c-success); color: #34d399; }
.act-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--c-danger); color: #f87171; }

footer {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 30px;
  background: rgba(15, 23, 42, 0.95); border-top: 1px solid var(--c-border);
  display: flex; justify-content: space-between; align-items: center; z-index: 1000;
}
.btn { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; }
.btn-primary { background: linear-gradient(135deg, #059669, #10b981); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
.btn-outline { background: transparent; color: #94a3b8; border: 1px solid var(--c-border); }

.toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 25px; border-radius: 50px; z-index: 2000; display: none; font-weight: 700; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
</style>
</head>

<div id="progress-container"><div id="progress-bar"></div></div>

    title: "غرس العادات وبناء الشخصية",
    story: "الدواء يجهز الأرض للزراعة، لكن العلاج السلوكي هو الذي يغرس البذور. بدون استراتيجيات الأهل، يظل الدواء حلاً مؤقتاً لا يبني مهارات دائمة.",
    content: "يعتمد العلاج السلوكي والتربوي على تعديل سلوكيات الطفل عبر استراتيجيات يستخدمها الأهل والمعلمون باستمرار. الدواء وحده لا يغني أبداً عن هذه الركيزة المكملة.",
    visual: `<div class="v-icon"><i class="fa-solid fa-hands-holding-child"></i></div><div style="font-weight:700">الأسرة: المعالج الأهم في رحلة الطفل</div>`,
    quiz: { 
      q: "ما هي الحقيقة القاطعة حول العلاج الدوائي؟", 
      opts: ["هو الحل الوحيد والنهائي", "لا يغني عن العلاج السلوكي والتربوي المكملين"], 
      ans: 1, 
      fb: "أحسنت! الشفاء والاندماج يتطلبان تعديلاً في السلوك والبيئة جنباً إلى جنب مع الدواء." 
    }
  }
];
// --- Core Engine (Emerald System) ---
let currentSlide = 0;
let userScore = 0;
const total = SLIDE_DATA.length;

function initApp() {
  const container = document.getElementById('main-container');
  SLIDE_DATA.forEach((slide, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide' + (index === 0 ? ' active' : '');
    slideDiv.id = 'slide-' + index;
    
    slideDiv.innerHTML = `
      <div class="card">
        <div class="tag">${slide.tag}</div>
        <h2>${slide.title}</h2>
        <div class="story-box"><i class="fa-solid fa-quote-right"></i><p>${slide.story}</p></div>
        <p style="font-size:1.15rem; margin-bottom:20px; font-weight:600; text-align:justify; color:#cbd5e1;">${slide.content}</p>
        <div class="visual-box">${slide.visual}</div>
        <div class="activity-box" id="actBox-${index}">
          <p style="font-weight:900; margin-bottom:15px; color:#f59e0b;"><i class="fa-solid fa-bolt"></i> تحدي النيورون:</p>
          <p style="margin-bottom:15px; font-weight:700; color:white;">${slide.quiz.q}</p>
          <div style="display:grid; gap:10px;">
            <button class="act-btn" onclick="checkAns(${index}, 0, ${slide.quiz.ans}, this)"><span>${slide.quiz.opts[0]}</span></button>
            <button class="act-btn" onclick="checkAns(${index}, 1, ${slide.quiz.ans}, this)"><span>${slide.quiz.opts[1]}</span></button>
          </div>
          <div class="feedback-msg" id="fb-${index}" style="display:none; padding:12px; border-radius:8px; margin-top:10px; font-weight:800;"></div>
        </div>
      </div>
    `;
    container.appendChild(slideDiv);
  });
  updateUI();
}

function checkAns(sIdx, chosen, correct, btn) {
  const box = document.getElementById(`actBox-${sIdx}`);
  if (box.dataset.answered === "true") return;
  box.dataset.answered = "true";

  const fb = document.getElementById(`fb-${sIdx}`);
  const buttons = box.querySelectorAll('.act-btn');
  buttons.forEach(b => b.disabled = true);

  if (chosen === correct) {
    btn.classList.add('correct');
    fb.innerHTML = "✅ استنتاج عبقري! مساراتك العصبية في قمة نشاطها.";
    fb.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
    fb.style.color = "#34d399";
    userScore += 100;
    showToast("+100 نقطة إدراك!");
    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#10b981', '#f59e0b', '#ffffff'] });
  } else {
    btn.classList.add('wrong');
    fb.innerHTML = "❌ محاولة جيدة.. تذكر أن التكامل هو المفتاح دائماً.";
    fb.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
    fb.style.color = "#f87171";
    buttons[correct].classList.add('correct');
  }
  fb.style.display = "block";
  updateStats();
}

function move(dir) {
  const slides = document.querySelectorAll('.slide');
  if (currentSlide + dir < 0 || currentSlide + dir >= total) return;
  
  slides[currentSlide].classList.remove('active');
  currentSlide += dir;
  slides[currentSlide].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateUI();
}

function updateUI() {
  document.getElementById('counter').innerText = `${currentSlide + 1} / ${total}`;
  document.getElementById('progress-bar').style.width = ((currentSlide + 1) / total * 100) + '%';
  document.getElementById('btn-prev').disabled = currentSlide === 0;
  document.getElementById('btn-next').disabled = currentSlide === total - 1;
}

function updateStats() {
  document.getElementById('scoreDisplay').innerText = userScore;
  let level = "مبتدئ";
  if (userScore >= 200) level = "باحث سلوكي";
  if (userScore >= 400) level = "محلل أعصاب";
  if (userScore >= 500) level = "خبير شامل";
  document.getElementById('levelDisplay').innerText = level;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

window.onload = initApp;
</script>
</body>
</html>
