<style>
/* ==========================================================================
   CSS System & Variables - "Emerald Luxury" Theme (Inherited from test4)
   ========================================================================== */
:root {
  --c-primary: #059669; 
  --c-primary-light: #d1fae5; 
  --c-primary-dark: #047857; 
  --c-accent: #f59e0b; 
  --c-accent-light: #fef3c7; 
  --c-bg: #f8fafc; 
  --c-surface: #ffffff;
  --c-text-main: #1e293b; 
  --c-text-muted: #64748b; 
  --c-danger: #ef4444;
  --c-danger-light: #fee2e2;
  --c-success: #10b981;
  --c-border: #e2e8f0;
  --font-main: 'Cairo', sans-serif;
  --font-story: 'Tajawal', sans-serif;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --shadow-glow: 0 0 15px rgba(5, 150, 105, 0.3);
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --r-full: 9999px;
  --t-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --t-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background-color: var(--c-bg);
  color: var(--c-text-main);
  line-height: 1.8;
  overflow-x: hidden;
  background-image: radial-gradient(var(--c-primary-light) 1px, transparent 1px);
  background-size: 30px 30px;
}

/* Typography */
h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; color: var(--c-primary-dark); margin-bottom: 20px; }
h2 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; color: var(--c-primary); margin-bottom: 15px; }
p { font-size: clamp(1rem, 2.5vw, 1.15rem); color: var(--c-text-main); margin-bottom: 15px; }
strong { color: var(--c-primary-dark); font-weight: 800; }

/* Layout */
#progress-container { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--c-border); z-index: 1001; }
#progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--c-accent), var(--c-primary)); transition: width var(--t-base); box-shadow: var(--shadow-glow); }

header {
  position: fixed; top: 6px; left: 0; right: 0; height: 65px;
  background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(10px, 3vw, 30px); border-bottom: 1px solid var(--c-border); z-index: 1000;
  box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--c-primary-dark); font-size: clamp(1rem, 3vw, 1.2rem); }
.stats { display: flex; align-items: center; gap: 10px; }
.badge { background: var(--c-bg); border: 1px solid var(--c-border); padding: 5px 12px; border-radius: var(--r-full); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; box-shadow: var(--shadow-sm); }
.badge i { color: var(--c-accent); }

main { padding: 90px 15px 120px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.slide { display: none; width: 100%; max-width: 900px; animation: fadeUp var(--t-base) forwards; }
.slide.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

footer {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 15px clamp(10px, 3vw, 30px);
  background: rgba(255, 255, 255, 0.98); border-top: 1px solid var(--c-border);
  display: flex; justify-content: space-between; align-items: center; z-index: 1000;
}

/* UI Components */
.card { background: var(--c-surface); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 35px); box-shadow: var(--shadow-md); border: 1px solid rgba(5, 150, 105, 0.1); margin-bottom: 25px; }
.tag { display: inline-block; padding: 5px 15px; background: var(--c-primary-light); color: var(--c-primary-dark); border-radius: var(--r-full); font-size: 0.8rem; font-weight: 800; margin-bottom: 15px; }
.story-box { background: linear-gradient(to left, var(--c-bg), var(--c-surface)); border-right: 4px solid var(--c-accent); padding: 20px; border-radius: var(--r-md); margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-start; }
.story-box i { font-size: 2rem; color: var(--c-accent); margin-top: 5px; }
.story-box p { font-family: var(--font-story); font-size: 1.1rem; color: var(--c-text-main); margin: 0; font-style: italic; }
.visual-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: var(--r-md); padding: 25px; margin: 20px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
.v-icon { font-size: clamp(3rem, 6vw, 4rem); color: var(--c-primary); }
.v-caption { font-size: 0.95rem; font-weight: 700; color: var(--c-text-muted); text-align: center; }
.v-flex { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vw, 30px); flex-wrap: wrap; width: 100%; }
.v-item { display: flex; flex-direction: column; align-items: center; text-align: center; background: white; padding: 15px; border-radius: var(--r-sm); box-shadow: var(--shadow-sm); flex: 1; min-width: 120px; }

/* Activities */
.activity-box { background: linear-gradient(135deg, var(--c-surface), #fefce8); border: 1px solid var(--c-accent); border-radius: var(--r-lg); padding: 25px; position: relative; overflow: hidden; }
.act-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #b45309; font-weight: 900; font-size: 1.1rem; }
.act-options { display: grid; gap: 12px; margin-top: 15px; }
.act-btn { background: var(--c-surface); border: 2px solid var(--c-border); padding: 15px; border-radius: var(--r-md); cursor: pointer; font-family: var(--font-main); font-size: 1rem; font-weight: 600; text-align: right; transition: all var(--t-base); color: var(--c-text-main); display: flex; justify-content: space-between; align-items: center; }
.act-btn:hover:not(:disabled) { border-color: var(--c-primary); transform: translateX(-5px); background: var(--c-primary-light); }
.act-btn.correct { background: var(--c-success-light); border-color: var(--c-success); color: #065f46; }
.act-btn.correct::after { content: '\f058'; font-family: 'Font Awesome 6 Free'; font-weight: 900; }
.act-btn.wrong { background: var(--c-danger-light); border-color: var(--c-danger); color: #991b1b; }
.act-btn.wrong::after { content: '\f057'; font-family: 'Font Awesome 6 Free'; font-weight: 900; }
.feedback-msg { margin-top: 15px; padding: 15px; border-radius: var(--r-sm); font-weight: 700; display: none; animation: fadeUp 0.3s; }

/* Buttons & Overlays */
.btn { padding: 12px clamp(15px, 4vw, 30px); border-radius: var(--r-full); border: none; font-weight: 800; cursor: pointer; font-family: var(--font-main); transition: all var(--t-base); font-size: clamp(0.9rem, 2.5vw, 1rem); display: flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--c-primary); color: white; box-shadow: var(--shadow-md); }
.btn-outline { background: var(--c-surface); color: var(--c-text-muted); border: 1px solid var(--c-border); }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(50px); background: var(--c-text-main); color: white; padding: 12px 25px; border-radius: var(--r-full); display: flex; align-items: center; gap: 10px; font-weight: 700; box-shadow: var(--shadow-lg); z-index: 1000; opacity: 0; transition: all var(--t-bounce); white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.pulse-anim { animation: customPulse 1.5s infinite; }
@keyframes customPulse { 0% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(5, 150, 105, 0); } 100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); } }

@media (max-width: 600px) { .act-btn { flex-direction: column; align-items: flex-start; } .v-flex { flex-direction: column; } }
</style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<header>
  <div class="brand"><i class="fa-solid fa-sitemap"></i> استراتيجيات التربية الخاصة</div>
  <div class="stats">

// --- Application Logic (Copy of test4 system) ---
let currentSlide = 0;
let userScore = 0;
const totalSlides = SLIDE_DATA.length;
const mainContainer = document.getElementById('main-container');
const prevBtn = document.getElementById('btn-prev');
const nextBtn = document.getElementById('btn-next');
const counter = document.getElementById('counter');
const progBar = document.getElementById('progress-bar');
const scoreDisplay = document.getElementById('scoreDisplay');
const toastEl = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

function initApp() {
  SLIDE_DATA.forEach((slide, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide card' + (index === 0 ? ' active' : '');
    slideDiv.id = 'slide-' + index;

    let html = `<div class="tag">${slide.tag}</div>`;
    html += `<h2>${slide.title}</h2>`;
    if(slide.story) html += `<div class="story-box"><i class="fa-solid fa-quote-right"></i><p>${slide.story}</p></div>`;
    if(slide.content) html += `<p style="font-weight: 600; text-align: justify; line-height: 1.9;">${slide.content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>`;
    if(slide.visual) html += `<div class="visual-box">${slide.visual}</div>`;

    if(slide.quiz) {
      html += `
        <div class="activity-box" id="actBox-${index}" data-answered="false">
          <div class="act-header"><i class="fa-solid fa-bolt"></i> تحدي الاستيعاب:</div>
          <p style="font-weight: 700; color: var(--c-secondary); font-size: 1.1rem; margin-bottom:10px;">${slide.quiz.q}</p>
          <div class="act-options">
            <button class="act-btn" onclick="handleAct(${index}, this, 0, ${slide.quiz.ans}, '${slide.quiz.fb}')"><span>${slide.quiz.opts[0]}</span></button>
            <button class="act-btn" onclick="handleAct(${index}, this, 1, ${slide.quiz.ans}, '${slide.quiz.fb}')"><span>${slide.quiz.opts[1]}</span></button>
          </div>
          <div class="feedback-msg" id="fb-${index}"></div>
        </div>
      `;
    }

    if(index === totalSlides - 1) {
       html += `<div style="text-align:center; margin-top:30px;"><button class="btn btn-primary" style="display:inline-flex; font-size:1.2rem;" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> إعادة الرحلة</button></div>`;
    }

    slideDiv.innerHTML = html;
    mainContainer.appendChild(slideDiv);
  });
  updateUI();
}

function handleAct(slideIndex, btn, chosenIdx, correctIdx, fbText) {
  const box = document.getElementById(`actBox-${slideIndex}`);
  if (box.getAttribute('data-answered') === "true") return;
  box.setAttribute('data-answered', "true");

  const buttons = box.querySelectorAll('.act-btn');
  const fbDiv = document.getElementById(`fb-${slideIndex}`);
  buttons.forEach(b => b.disabled = true);

  if (chosenIdx === correctIdx) {
    btn.classList.add('correct');
    fbDiv.innerHTML = `<i class="fa-solid fa-check"></i> ${fbText}`;
    fbDiv.style.color = "#065f46";
    fbDiv.style.backgroundColor = "var(--c-success-light)";
    userScore += 50;
    scoreDisplay.innerText = userScore;
    updateLevel();
    showToast("إنجاز! +50 نقطة");
    fireConfetti(btn);
  } else {
    btn.classList.add('wrong');
    fbDiv.innerHTML = `<i class="fa-solid fa-xmark"></i> ${fbText}`;
    fbDiv.style.color = "#991b1b";
    fbDiv.style.backgroundColor = "var(--c-danger-light)";
    buttons[correctIdx].classList.add('correct');
  }
  fbDiv.style.display = "block";
  document.getElementById('btn-next').classList.add('pulse-anim');
  setTimeout(() => document.getElementById('btn-next').classList.remove('pulse-anim'), 2000);
}

function move(dir) {
  const slides = document.querySelectorAll('.slide');
  if (currentSlide + dir < 0 || currentSlide + dir >= totalSlides) return;
  slides[currentSlide].classList.remove('active');
  currentSlide += dir;
  slides[currentSlide].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateUI();
  if (currentSlide === totalSlides - 1) {
    const finalDisplay = document.getElementById('finalScoreText');
    if(finalDisplay) finalDisplay.innerText = userScore;
    fireHugeConfetti();
  }
}

function updateUI() {
  counter.innerText = `${currentSlide + 1} / ${totalSlides}`;
  progBar.style.width = (((currentSlide + 1) / totalSlides) * 100) + '%';
  prevBtn.disabled = currentSlide === 0;
  nextBtn.style.display = currentSlide === totalSlides - 1 ? "none" : "inline-flex";
}

function updateLevel() {
  const lvEl = document.getElementById('levelDisplay');
  let level = "مبتدئ";
  if (userScore >= 300) level = "محلل استراتيجيات";
  if (userScore >= 600) level = "خبير نظم تربوية";
  lvEl.innerText = level;
}

function showToast(msg) {
  toastMsg.innerText = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function fireConfetti(el) {
  const rect = el.getBoundingClientRect();
  const x = (rect.left + rect.width / 2) / window.innerWidth;
  const y = (rect.top + rect.height / 2) / window.innerHeight;
  confetti({ particleCount: 40, spread: 50, origin: { x, y }, colors: ['#059669', '#f59e0b', '#ffffff'] });
}

function fireHugeConfetti() {
  var duration = 4 * 1000;
  var end = Date.now() + duration;
  (function frame() {
    confetti({ particleCount: 7, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#059669', '#f59e0b'] });
    confetti({ particleCount: 7, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#059669', '#f59e0b'] });
    if (Date.now() < end) requestAnimationFrame(frame);
  }());
}

window.onload = initApp;
</script>

</html>
