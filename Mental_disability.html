<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ==========================================================================
   CSS System - Emerald Luxury Theme
   ========================================================================== */
:root {
  --c-primary: #059669; 
  --c-primary-light: #d1fae5; 
  --c-primary-dark: #047857; 
  --c-accent: #f59e0b; 
  --c-bg: #f8fafc; 
  --c-surface: #ffffff;
  --c-text-main: #1e293b; 
  --c-text-muted: #64748b; 
  --c-danger: #ef4444;
  --c-success: #10b981;
  --c-border: #e2e8f0;
  --font-main: 'Cairo', sans-serif;
  --font-story: 'Tajawal', sans-serif;
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --r-lg: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background-color: var(--c-bg);
  color: var(--c-text-main);
  line-height: 1.8;
  background-image: radial-gradient(var(--c-primary-light) 1px, transparent 1px);
  background-size: 30px 30px;
}

#progress-container { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--c-border); z-index: 1001; }
#progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--c-accent), var(--c-primary)); transition: 0.3s; }

header {
  position: fixed; top: 6px; left: 0; right: 0; height: 65px;
  background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--c-border); z-index: 1000;
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--c-primary-dark); }
.stats { display: flex; align-items: center; gap: 10px; }
.badge { background: var(--c-bg); border: 1px solid var(--c-border); padding: 5px 12px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }

main { padding: 90px 15px 120px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
.slide { display: none; width: 100%; max-width: 900px; animation: fadeUp 0.4s forwards; }
.slide.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--c-surface); border-radius: var(--r-lg); padding: clamp(20px, 4vw, 35px); box-shadow: var(--shadow-md); border: 1px solid rgba(5, 150, 105, 0.1); margin-bottom: 25px; }
.tag { display: inline-block; padding: 5px 15px; background: var(--c-primary-light); color: var(--c-primary-dark); border-radius: 50px; font-size: 0.8rem; font-weight: 800; margin-bottom: 15px; }

.story-box { background: linear-gradient(to left, var(--c-bg), var(--c-surface)); border-right: 4px solid var(--c-accent); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; }
.story-box i { font-size: 1.8rem; color: var(--c-accent); }
.story-box p { font-family: var(--font-story); font-style: italic; margin: 0; }

.visual-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 15px; padding: 25px; margin: 20px 0; text-align: center; }
.v-icon { font-size: 3.5rem; color: var(--c-primary); margin-bottom: 10px; }

.activity-box { background: linear-gradient(135deg, var(--c-surface), #fefce8); border: 1px solid var(--c-accent); border-radius: var(--r-lg); padding: 25px; }
.act-btn {
  width: 100%; background: var(--c-surface); border: 2px solid var(--c-border); padding: 15px;
  border-radius: 12px; cursor: pointer; font-family: var(--font-main); font-size: 1rem;
  font-weight: 600; text-align: right; margin-bottom: 10px; transition: all 0.2s;
  display: flex; justify-content: space-between; align-items: center;
}
.act-btn:hover:not(:disabled) { border-color: var(--c-primary); transform: translateX(-5px); }
.act-btn.correct { background: #d1fae5; border-color: var(--c-success); color: #065f46; }
.act-btn.wrong { background: #fee2e2; border-color: var(--c-danger); color: #991b1b; }

footer {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 30px;
  background: white; border-top: 1px solid var(--c-border);
  display: flex; justify-content: space-between; align-items: center; z-index: 1000;
}
.btn { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; }
.btn-primary { background: var(--c-primary); color: white; }
.btn-outline { background: white; color: var(--c-text-muted); border: 1px solid var(--c-border); }

.toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 50px; z-index: 2000; display: none; font-weight: 700; }
</style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<header>
  <div class="brand"><i class="fa-solid fa-brain"></i> أكاديمية النمو الذهني</div>
  <div class="stats">
    <div class="badge"><i class="fa-solid fa-star"></i> <span id="scoreDisplay">0</span></div>

</header>

<div class="toast" id="toast"></div>

<main id="main-container"></main>

<footer>

  <div id="counter" style="font-weight:900; color:var(--c-primary);">1 / --</div>
  <button class="btn btn-primary" id="btn-next" onclick="move(1)">التالي</button>
</footer>

// --- Core Engine ---
let currentSlide = 0;
let userScore = 0;
const total = SLIDE_DATA.length;

function initApp() {
  const container = document.getElementById('main-container');
  SLIDE_DATA.forEach((slide, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide' + (index === 0 ? ' active' : '');
    slideDiv.id = 'slide-' + index;
    
    slideDiv.innerHTML = `
      <div class="card">
        <div class="tag">${slide.tag}</div>
        <h2>${slide.title}</h2>
        <div class="story-box"><i class="fa-solid fa-quote-right"></i><p>${slide.story}</p></div>
        <p style="font-size:1.15rem; margin-bottom:20px; font-weight:600;">${slide.content}</p>
        <div class="visual-box">${slide.visual}</div>
        <div class="activity-box" id="actBox-${index}">
          <p style="font-weight:900; margin-bottom:15px; color:#b45309;"><i class="fa-solid fa-bolt"></i> تحدي الاستيعاب السريع:</p>
          <p style="margin-bottom:15px; font-weight:700;">${slide.quiz.q}</p>
          <button class="act-btn" onclick="checkAns(${index}, 0, ${slide.quiz.ans}, this)"><span>${slide.quiz.opts[0]}</span></button>
          <button class="act-btn" onclick="checkAns(${index}, 1, ${slide.quiz.ans}, this)"><span>${slide.quiz.opts[1]}</span></button>
          <div class="feedback-msg" id="fb-${index}" style="display:none; padding:10px; border-radius:8px; margin-top:10px; font-weight:800;"></div>
        </div>
      </div>
    `;
    container.appendChild(slideDiv);
  });
  updateUI();
}

function checkAns(sIdx, chosen, correct, btn) {
  const box = document.getElementById(`actBox-${sIdx}`);
  if (box.dataset.answered === "true") return;
  box.dataset.answered = "true";

  const fb = document.getElementById(`fb-${sIdx}`);
  const buttons = box.querySelectorAll('.act-btn');
  buttons.forEach(b => b.disabled = true);

  if (chosen === correct) {
    btn.classList.add('correct');
    fb.innerHTML = "✅ إجابة رائعة! لقد استوعبت المفهوم بعمق.";
    fb.style.backgroundColor = "#d1fae5";
    fb.style.color = "#065f46";
    userScore += 100;
    showToast("+100 نقطة! ممتاز");
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#059669', '#f59e0b'] });
  } else {
    btn.classList.add('wrong');
    fb.innerHTML = "❌ محاولة جيدة.. الإجابة الصحيحة محددة بالأخضر.";
    fb.style.backgroundColor = "#fee2e2";
    fb.style.color = "#991b1b";
    buttons[correct].classList.add('correct');
  }
  fb.style.display = "block";
  updateStats();
}

function move(dir) {
  const slides = document.querySelectorAll('.slide');
  if (currentSlide + dir < 0 || currentSlide + dir >= total) return;
  
  slides[currentSlide].classList.remove('active');
  currentSlide += dir;
  slides[currentSlide].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateUI();
}

function updateUI() {
  document.getElementById('counter').innerText = `${currentSlide + 1} / ${total}`;
  document.getElementById('progress-bar').style.width = ((currentSlide + 1) / total * 100) + '%';
  document.getElementById('btn-prev').disabled = currentSlide === 0;
  document.getElementById('btn-next').disabled = currentSlide === total - 1;
}

function updateStats() {
  document.getElementById('scoreDisplay').innerText = userScore;
  let level = "مبتدئ";
  if (userScore >= 200) level = "ممارس";
  if (userScore >= 400) level = "باحث ذكي";
  if (userScore >= 600) level = "خبير نمو";
  document.getElementById('levelDisplay').innerText = level;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

window.onload = initApp;
</script>
