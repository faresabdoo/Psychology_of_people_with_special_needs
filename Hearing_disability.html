<style>
/* ==========================================================================
   CSS System - Emerald Luxury Theme (نفس تنسيق ملف التربية الخاصة)
   ========================================================================== */
:root {
  --c-primary: #059669; 
  --c-primary-light: #d1fae5; 
  --c-primary-dark: #047857; 
  --c-accent: #f59e0b; 
  --c-accent-light: #fef3c7; 
  --c-bg: #f8fafc; 
  --c-surface: #ffffff;
  --c-text-main: #1e293b; 
  --c-text-muted: #64748b; 
  --c-danger: #ef4444;
  --c-danger-light: #fee2e2;
  --c-success: #10b981;
  --c-border: #e2e8f0;
  --font-main: 'Cairo', sans-serif;
  --font-story: 'Tajawal', sans-serif;
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  --r-lg: 20px;
  --t-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background-color: var(--c-bg);
  color: var(--c-text-main);
  line-height: 1.8;
  overflow-x: hidden;
  background-image: radial-gradient(var(--c-primary-light) 1px, transparent 1px);
  background-size: 30px 30px;
}

#progress-container {
  position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--c-border); z-index: 1001;
}
#progress-bar {
  height: 100%; width: 0%; background: linear-gradient(90deg, var(--c-accent), var(--c-primary)); transition: width var(--t-base);
}

header {
  position: fixed; top: 6px; left: 0; right: 0; height: 65px;
  background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--c-border); z-index: 1000;
}

.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--c-primary-dark); }
.stats { display: flex; align-items: center; gap: 10px; }
.badge { background: var(--c-bg); border: 1px solid var(--c-border); padding: 5px 12px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }

main { padding: 90px 15px 120px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

.slide { display: none; width: 100%; max-width: 900px; animation: fadeUp var(--t-base) forwards; }
.slide.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--c-surface); border-radius: var(--r-lg); padding: 30px; box-shadow: var(--shadow-md); border: 1px solid rgba(5, 150, 105, 0.1); margin-bottom: 25px; }
.tag { display: inline-block; padding: 5px 15px; background: var(--c-primary-light); color: var(--c-primary-dark); border-radius: 50px; font-size: 0.8rem; font-weight: 800; margin-bottom: 15px; }

.story-box { background: linear-gradient(to left, var(--c-bg), var(--c-surface)); border-right: 4px solid var(--c-accent); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; }
.story-box i { font-size: 1.8rem; color: var(--c-accent); }

.visual-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 25px; margin: 20px 0; text-align: center; }
.v-icon { font-size: 3.5rem; color: var(--c-primary); margin-bottom: 10px; }

.activity-box { background: linear-gradient(135deg, var(--c-surface), #fefce8); border: 1px solid var(--c-accent); border-radius: var(--r-lg); padding: 25px; }
.act-btn {
  width: 100%; background: var(--c-surface); border: 2px solid var(--c-border); padding: 15px;
  border-radius: 12px; cursor: pointer; font-family: var(--font-main); font-size: 1rem;
  font-weight: 600; text-align: right; margin-bottom: 10px; transition: all 0.2s;
  display: flex; justify-content: space-between; align-items: center;
}
.act-btn:hover:not(:disabled) { border-color: var(--c-primary); background: var(--c-primary-light); }
.act-btn.correct { background: #d1fae5; border-color: var(--c-success); color: #065f46; }
.act-btn.wrong { background: #fee2e2; border-color: var(--c-danger); color: #991b1b; }

.feedback-msg { margin-top: 10px; padding: 12px; border-radius: 8px; font-weight: 700; display: none; }

footer {
  position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 30px;
  background: white; border-top: 1px solid var(--c-border);
  display: flex; justify-content: space-between; align-items: center; z-index: 1000;
}
.btn { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; }
.btn-primary { background: var(--c-primary); color: white; }
.btn-outline { background: white; color: var(--c-text-muted); border: 1px solid var(--c-border); }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: white; padding: 10px 20px; border-radius: 50px;
  z-index: 2000; display: none; font-weight: 700;
}
</style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<main id="main-container"></main>

  <button class="btn btn-primary" id="btn-next" onclick="move(1)">التالي</button>
</footer>

// --- Logic System (نفس منطق ملف التربية الخاصة) ---
let currentSlide = 0;
let userScore = 0;
const total = SLIDE_DATA.length;

function initApp() {
  const container = document.getElementById('main-container');
  SLIDE_DATA.forEach((slide, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide' + (index === 0 ? ' active' : '');
    slideDiv.id = 'slide-' + index;
    
    slideDiv.innerHTML = `
      <div class="card">
        <div class="tag">${slide.tag}</div>
        <h2>${slide.title}</h2>
        <div class="story-box"><i class="fa-solid fa-quote-right"></i><p>${slide.story}</p></div>
        <p style="font-size:1.1rem; margin-bottom:20px;">${slide.content}</p>
        <div class="visual-box">${slide.visual}</div>
        <div class="activity-box" id="actBox-${index}">
          <p style="font-weight:800; margin-bottom:15px; color:#b45309;">تحدي الاستيعاب:</p>
          <p style="margin-bottom:15px;">${slide.quiz.q}</p>
          <button class="act-btn" onclick="checkAns(${index}, 0, ${slide.quiz.ans}, this)">${slide.quiz.opts[0]}</button>
          <button class="act-btn" onclick="checkAns(${index}, 1, ${slide.quiz.ans}, this)">${slide.quiz.opts[1]}</button>
          <div class="feedback-msg" id="fb-${index}"></div>
        </div>
      </div>
    `;
    container.appendChild(slideDiv);
  });
  updateUI();
}

function checkAns(sIdx, chosen, correct, btn) {
  const box = document.getElementById(`actBox-${sIdx}`);
  if (box.dataset.answered === "true") return;
  box.dataset.answered = "true";

  const fb = document.getElementById(`fb-${sIdx}`);
  fb.style.display = "block";

  if (chosen === correct) {
    btn.classList.add('correct');
    fb.innerText = "✅ إجابة متميزة! استمر في التألق.";
    fb.style.color = "#065f46";
    userScore += 100;
    showToast("+100 نقطة! رائع");
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  } else {
    btn.classList.add('wrong');
    fb.innerText = "❌ محاولة جيدة، لكن الإجابة الصحيحة هي الخيار الآخر.";
    fb.style.color = "#991b1b";
    box.querySelectorAll('.act-btn')[correct].classList.add('correct');
  }
  updateStats();
}

function move(dir) {
  const slides = document.querySelectorAll('.slide');
  slides[currentSlide].classList.remove('active');
  currentSlide += dir;
  if (currentSlide < 0) currentSlide = 0;
  if (currentSlide >= total) currentSlide = total - 1;
  slides[currentSlide].classList.add('active');
  window.scrollTo(0,0);
  updateUI();
}

function updateUI() {
  document.getElementById('counter').innerText = `${currentSlide + 1} / ${total}`;
  document.getElementById('progress-bar').style.width = ((currentSlide + 1) / total * 100) + '%';
  document.getElementById('btn-prev').disabled = currentSlide === 0;
  document.getElementById('btn-next').disabled = currentSlide === total - 1;
}

function updateStats() {
  document.getElementById('scoreDisplay').innerText = userScore;
  let level = "مبتدئ";
  if (userScore >= 200) level = "ممارس";
  if (userScore >= 400) level = "خبير";
  document.getElementById('levelDisplay').innerText = level;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

window.onload = initApp;
</script>
